name: Release Binaries

# Builds standalone `mcp-shield` binaries for macOS, Windows, and Linux
# whenever a version tag (v*) is pushed, and attaches them to the GitHub
# Release. The binary needs no Python install — no-code users just download
# and run it.
#
# Trigger: push a tag like `v0.2.0` or `v0.2.0-alpha`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}  # manual run from the Actions tab

permissions:
  contents: write  # to attach assets to the release

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            artifact: mcp-shield-linux-x64
            asset_name: mcp-shield-linux-x64
            ext: ""
          - os: macos-arm
            runner: macos-latest
            artifact: mcp-shield-macos-arm64
            asset_name: mcp-shield-macos-arm64
            ext: ""
          - os: macos-x64
            runner: macos-13
            artifact: mcp-shield-macos-x64
            asset_name: mcp-shield-macos-x64
            ext: ""
          - os: windows
            runner: windows-latest
            artifact: mcp-shield-windows-x64
            asset_name: mcp-shield-windows-x64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyyaml jsonschema

      - name: Build binary
        run: pyinstaller mcp-shield.spec --noconfirm --clean

      - name: Smoke test (unix)
        if: matrix.os != 'windows'
        run: |
          chmod +x dist/mcp-shield
          ./dist/mcp-shield --help
          # Verify the bundled default policy loads with no --policy flag.
          ./dist/mcp-shield -- echo ok || true

      - name: Smoke test (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          .\dist\mcp-shield.exe --help

      - name: Stage asset (unix)
        if: matrix.os != 'windows'
        run: |
          mkdir -p staging
          cp dist/mcp-shield staging/${{ matrix.asset_name }}
          chmod +x staging/${{ matrix.asset_name }}

      - name: Stage asset (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item dist/mcp-shield.exe "staging/${{ matrix.asset_name }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging/*

  release:
    name: Attach to Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mcp-shield-linux-x64/*
            artifacts/mcp-shield-macos-arm64/*
            artifacts/mcp-shield-macos-x64/*
            artifacts/mcp-shield-windows-x64/*
          generate_release_notes: true
