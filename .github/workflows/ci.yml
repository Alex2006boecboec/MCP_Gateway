name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cloud]"
          pip install ruff

      - name: Lint with ruff
        run: |
          ruff check mcp_shield/ tests/ || true  # non-blocking for now

      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=short

      - name: Run smoke tests
        run: |
          python tests/smoke_cloud.py
          python tests/smoke_approval.py || true  # may need interactive setup

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not set, skipping deploy"
            exit 0
          fi
          # Install Railway CLI
          npm install -g @railway/cli
          # Deploy
          railway up --service mcp-shield-cloud || echo "Deploy failed or not configured"
