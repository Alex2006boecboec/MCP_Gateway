[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-shield"
version = "0.1.0"
description = "Security gateway for MCP (Model Context Protocol) — intercepts AI agent tool calls, enforces policy, detects prompt injection, redacts secrets, audits everything."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MCP Shield Contributors"}]
keywords = ["mcp", "model-context-protocol", "ai-security", "prompt-injection", "agent-security", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
detector = [
    "sentence-transformers>=2.2",
    "scikit-learn>=1.3",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "httpx>=0.25",
]
cloud = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.6",
    "psycopg2-binary>=2.9",
    "httpx>=0.25",
]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "httpx>=0.25",
]

[project.scripts]
mcp-shield = "mcp_shield.cli:main"
mcp-shield-cloud = "mcp_shield.cloud.server:main"

[project.urls]
Homepage = "https://github.com/Alex2006boecboec/MCP_Gateway"
Documentation = "https://github.com/Alex2006boecboec/MCP_Gateway#readme"
Repository = "https://github.com/Alex2006boecboec/MCP_Gateway"
Issues = "https://github.com/Alex2006boecboec/MCP_Gateway/issues"
Changelog = "https://github.com/Alex2006boecboec/MCP_Gateway/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_shield*"]

[tool.setuptools.package-data]
mcp_shield = ["cloud/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
