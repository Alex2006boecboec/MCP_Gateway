<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Shield - Login</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .login-box { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); width: 360px; }
    .login-box h1 { margin: 0 0 8px; font-size: 24px; }
    .login-box p { color: #666; margin: 0 0 24px; font-size: 14px; }
    .login-box label { display: block; margin: 12px 0 4px; font-size: 14px; font-weight: 600; }
    .login-box input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    .login-box button { width: 100%; margin-top: 20px; padding: 12px; background: #0d6efd; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
    .login-box button:hover { background: #0b5ed7; }
    .error { color: #dc3545; margin: 12px 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>MCP Shield</h1>
    <p>Sign in to the security dashboard</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
