<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Shield - Create Account</title>
  <style>
    :root {
      --bg: #0f1117;
      --bg-card: #1a1d29;
      --border: #2a2e3f;
      --text: #e4e6eb;
      --text-dim: #8b8fa3;
      --primary: #6366f1;
      --primary-hover: #5457e7;
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.12);
      --radius: 12px;
      --radius-sm: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .register-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .logo-row h1 { font-size: 22px; font-weight: 700; }
    .subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 32px; }
    .form-row { margin-bottom: 20px; }
    .form-row label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 8px; }
    .form-row input {
      width: 100%; padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 15px;
      transition: border-color 0.15s;
    }
    .form-row input:focus { outline: none; border-color: var(--primary); }
    .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .btn {
      width: 100%; padding: 13px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--primary-hover); }
    .error {
      color: var(--red);
      font-size: 14px;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: var(--red-bg);
      border-radius: var(--radius-sm);
    }
    .footer-link {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-dim);
    }
    .footer-link a { color: var(--primary); text-decoration: none; font-weight: 500; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="register-card">
    <div class="logo-row">
      <div class="logo">🛡</div>
      <h1>MCP Shield</h1>
    </div>
    <p class="subtitle">Create a new organization account</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/register">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-row">
        <label for="org_name">Organization Name</label>
        <input type="text" id="org_name" name="org_name" placeholder="Acme Inc." required autofocus>
        <div class="form-hint">Your company or team name</div>
      </div>
      <div class="form-row">
        <label for="email">Admin Email</label>
        <input type="email" id="email" name="email" placeholder="you@company.com" required>
        <div class="form-hint">You'll be the admin of this organization</div>
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
        <div class="form-hint">Minimum 8 characters</div>
      </div>
      <button type="submit" class="btn">Create Account</button>
    </form>
    <div class="footer-link">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>
</body>
</html>
