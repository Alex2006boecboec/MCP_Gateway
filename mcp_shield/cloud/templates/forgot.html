<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Shield - Forgot Password</title>
  <style>
    :root {
      --bg: #0f1117; --bg-card: #1a1d29; --border: #2a2e3f;
      --text: #e4e6eb; --text-dim: #8b8fa3; --text-muted: #6b6f80;
      --primary: #6366f1; --primary-hover: #5457e7;
      --green: #10b981; --green-bg: rgba(16, 185, 129, 0.12);
      --radius: 12px; --radius-sm: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 40px;
      width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .logo { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), #8b5cf6);
      border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .logo-row h1 { font-size: 22px; font-weight: 700; }
    .subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 32px; }
    .form-row { margin-bottom: 20px; }
    .form-row label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 8px; }
    .form-row input {
      width: 100%; padding: 12px 16px; background: var(--bg);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font-size: 15px; transition: border-color 0.15s;
    }
    .form-row input:focus { outline: none; border-color: var(--primary); }
    .btn {
      width: 100%; padding: 13px; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius-sm); font-size: 15px;
      font-weight: 600; cursor: pointer; transition: background 0.15s;
    }
    .btn:hover { background: var(--primary-hover); }
    .success { color: var(--green); font-size: 14px; margin-bottom: 20px;
      padding: 12px 16px; background: var(--green-bg); border-radius: var(--radius-sm); }
    .footer-link { text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-dim); }
    .footer-link a { color: var(--primary); text-decoration: none; font-weight: 500; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <div class="logo">🛡</div>
      <h1>MCP Shield</h1>
    </div>
    <p class="subtitle">Reset your password</p>
    {% if sent %}
      <div class="success">✓ If an account exists for that email, a reset link has been sent. Check your inbox.</div>
    {% else %}
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="post" action="/forgot">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@company.com" required autofocus>
        </div>
        <button type="submit" class="btn">Send Reset Link</button>
      </form>
    {% endif %}
    <div class="footer-link">
      <a href="/login">← Back to login</a>
    </div>
  </div>
</body>
</html>
